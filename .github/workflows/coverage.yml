name: coverage

on:
    workflow_call:

jobs:
    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  # Using a modern nightly to support the v4 lockfile
                  # and -Z unstable-options for JSON reports
                  toolchain: nightly-2026-03-01
                  components: llvm-tools-preview

            - name: Setup System Dependencies
              run: scripts/ubuntu-setup.sh

            - name: Install grcov
              run: |
                  curl -L https://github.com/mozilla/grcov/releases/latest/download/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf -
                  # Add current directory to PATH so the script can find grcov
                  echo "$(pwd)" >> $GITHUB_PATH

            - name: Run Coverage Script
              run: bash scripts/coverage-report.sh
              env:
                  CARGO_TERM_COLOR: always

            - name: Upload to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: lcov.info
                  # For public repos, this usually works without a token.
                  # If it fails, add: token: ${{ secrets.CODECOV_TOKEN }}
